name: KreativeOS mobile images
on:
  push:
    branches: [kreativeos-mobile]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Install build and QEMU dependencies
        run: |
          dpkg --add-architecture arm64
          sed -i 's/^Components: main$/Components: main non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make gcc             gcc-aarch64-linux-gnu libc6-dev libc6-dev-arm64-cross python3 python3-pil             fonts-dejavu-core ncurses-base libvterm-dev libcrypt-dev binutils binutils-aarch64-linux-gnu dosfstools mtools             fdisk e2fsprogs zstd kmod qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
      - uses: actions/checkout@v4
      - run: make test
      - run: bash scripts/debian-build.sh ${{ matrix.architecture }}
      - run: python3 scripts/smoke.py ${{ matrix.architecture }} --capture build/captures
      - uses: actions/upload-artifact@v4
        with:
          name: KreativeOS-${{ matrix.architecture }}
          path: |
            build/${{ matrix.architecture }}/*.img.gz
            build/${{ matrix.architecture }}/SHA256SUMS
            build/${{ matrix.architecture }}/COMPONENTS.txt
            build/${{ matrix.architecture }}/kreative-shell
            build/captures/*.ppm
