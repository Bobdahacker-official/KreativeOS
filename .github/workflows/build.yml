name: Build KreativeOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-uefi
      - name: Compile and create boot disk
        run: bash scripts/build.sh
      - name: Install boot-check tools
        timeout-minutes: 4
        run: |
          printf 'deb https://archive.ubuntu.com/ubuntu noble main universe\ndeb https://archive.ubuntu.com/ubuntu noble-updates main universe\n' > "$RUNNER_TEMP/kreative-apt.list"
          sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/kreative-apt.list" -o Dir::Etc::sourceparts=- -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/kreative-apt.list" -o Dir::Etc::sourceparts=- -o Acquire::https::Timeout=20 install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Boot once and capture desktop
        run: STORAGE=nvme python3 scripts/smoke.py
      - name: Verify HTTPS over Intel Ethernet and certificate rejection
        run: NIC_MODEL=e1000e python3 scripts/tls_check.py
      - name: Upload boot image and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KreativeOS-x86_64
          path: |
            build/KreativeOS.img
            build/KreativeOS-data.img
            build/KreativeOS-sata.img
            build/KreativeOS-nvme.img
            build/esp/EFI/BOOT/BOOTX64.EFI
            build/SHA256SUMS
            build/desktop.png
            build/serial.log
            build/tls-check.log
      - name: Upload formatted Rust source
        uses: actions/upload-artifact@v4
        with:
          name: KreativeOS-source
          path: |
            src/
            Cargo.lock
