name: Build KreativeOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-uefi
      - name: Compile and create boot disk
        run: bash scripts/build.sh
      - name: Install boot-check tools
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Boot once and capture desktop
        run: python3 scripts/smoke.py
      - name: Upload boot image and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KreativeOS-x86_64
          path: |
            build/KreativeOS.img
            build/KreativeOS-data.img
            build/esp/EFI/BOOT/BOOTX64.EFI
            build/SHA256SUMS
            build/desktop.png
            build/serial.log
      - name: Upload formatted Rust source
        uses: actions/upload-artifact@v4
        with:
          name: KreativeOS-source
          path: |
            src/
            Cargo.lock
