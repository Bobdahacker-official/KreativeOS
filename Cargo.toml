[package]
name = "kreativeos"
version = "0.1.0"
edition = "2021"
license = "MIT"
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
[profile.dev]
panic = "abort"

[features]
tls-smoke = []

[dependencies]
embedded-tls = { version = "=0.19.0", default-features = false, features = ["alloc"] }
embedded-io = "0.7"
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.2", features = ["custom"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
webpki-roots = "1"
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = { version = "0.8", default-features = false }
aes-kw = { version = "0.2", default-features = false }
ccm = { version = "0.5", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false }
linked_list_allocator = "0.10"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zune-core = { version = "0.5", default-features = false }
nopng = "=0.3.0"
zune-jpeg = { version = "0.5", default-features = false }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["no-std-float"] }
